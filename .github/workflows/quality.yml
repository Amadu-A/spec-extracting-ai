# .github/workflows/quality.yml
# CI выполняет Python/JS, Chromium E2E и настоящий Docker-тест без секретов сервера.
name: quality
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23', enable-cache: true}
      - run: bash scripts/test.sh --browser --docker
