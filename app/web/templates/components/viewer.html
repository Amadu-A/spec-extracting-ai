<!-- app/web/templates/components/viewer.html -->
<!-- Общие controls viewer обоих профилей; URL и состояние задаёт контроллер. -->
<section class="viewer panel" data-viewer aria-labelledby="{{ viewer_title_id|default('viewer-title') }}">
      <div class="viewer__toolbar">
        <h2 class="panel__title" id="{{ viewer_title_id|default('viewer-title') }}"><svg class="icon"><use href="/static/icons.svg#image"/></svg>Лист документа</h2>
        <div class="viewer__navigation"><button class="button button--icon" data-page-prev aria-label="Предыдущий PDF-лист" title="Предыдущий PDF-лист">‹</button>
          <label class="viewer__page-label">Лист <input data-page-number type="number" min="1" value="1" aria-label="Номер просматриваемой PDF-страницы"> <span data-page-total>из 0</span></label>
          <button class="button button--icon" data-page-next aria-label="Следующий PDF-лист" title="Следующий PDF-лист">›</button></div>
        <div class="viewer__zoom"><button class="button button--icon" data-zoom-out title="Уменьшить" aria-label="Уменьшить">−</button><output data-zoom>100%</output><button class="button button--icon" data-zoom-in title="Увеличить" aria-label="Увеличить">+</button></div>
        <button class="button button--icon" data-fit title="Вписать лист / по ширине" aria-label="Вписать лист / по ширине"><svg class="icon"><use href="/static/icons.svg#fit"/></svg></button>
        <button class="button button--icon" data-fullscreen title="Полноэкранный просмотр" aria-label="Полноэкранный просмотр"><svg class="icon"><use href="/static/icons.svg#full"/></svg></button>
        <span class="badge viewer__processing" data-processing-label>Нет обработки</span>
        <button class="button button--icon" data-hand title="Перетаскивание страницы" aria-label="Перетаскивание страницы" aria-pressed="false">✋</button>
        <button class="button button--icon" data-retry title="Повторить просмотренную страницу и зависимые листы" aria-label="Повторить просмотренную страницу" disabled><svg class="icon"><use href="/static/icons.svg#retry"/></svg></button>
      </div>
      <div class="viewer__canvas" data-canvas>
        <div class="viewer__empty" data-viewer-empty><svg><use href="/static/icons.svg#image"/></svg><p>Загрузите проектную документацию</p><small>Слева — оригинальный PDF, справа — ответ модели</small></div>
        <img class="viewer__image" data-page-image alt="" hidden>
        <p class="viewer__error" data-preview-error role="alert" hidden></p>
      </div>
      <div class="viewer__footer"><span data-selection-label>Страницы ещё не выбраны</span><button class="button button--soft" data-cancel hidden>Остановить анализ</button></div>
      <nav class="thumbnails" data-thumbnails aria-label="Миниатюры PDF-страниц"></nav>
    </section>
